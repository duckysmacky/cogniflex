name: Cogniflex

services:
  db:
    image: postgres:18
    container_name: cogniflex-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: cogniflex-redis
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: cogniflex-backend:latest
    container_name: cogniflex-backend
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - REDIS_HOST=redis
      - INFERENCE_HOST=inference
    volumes:
      - ./backend/src/main/resources:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference:
        condition: service_healthy
    networks:
      - backend-network
      - analysis-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:$${MANAGEMENT_PORT:-8081}/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: inference/Dockerfile
      secrets:
        - HF_TOKEN
    image: cogniflex-inference:latest
    container_name: cogniflex-inference
    env_file:
      - .env
    volumes:
      - ./inference/config.yaml:/app/inference/config.yaml:ro
      - ./inference/weights:/app/inference/weights:ro
    networks:
      - analysis-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, socket; socket.create_connection(("127.0.0.1", int(os.environ.get("GRPC_PORT") or 50051)), 3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge
  analysis-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

secrets:
  HF_TOKEN:
    environment: HF_TOKEN
