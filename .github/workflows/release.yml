name: Release

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  test:
    name: Backend tests
    uses: ./.github/workflows/backend-tests.yml

  build-latest:
    name: Build ${{ matrix.image }}:latest
    needs: [prepare, test]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - image: cogniflex-backend
            dockerfile: backend/Dockerfile
            scope: backend
          - image: cogniflex-inference
            dockerfile: inference/Dockerfile
            scope: inference
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:latest

  validate-tag:
    name: Validate release tag
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point to current origin/master
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master --tags --force
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          master_commit="$(git rev-parse origin/master)"
          if [[ "${tag_commit}" != "${master_commit}" ]]; then
            echo "Tag '${GITHUB_REF_NAME}' must point to the current origin/master commit" >&2
            exit 1
          fi

  build-release:
    name: Build ${{ matrix.image }}:version
    needs: [prepare, validate-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - image: cogniflex-backend
            dockerfile: backend/Dockerfile
            scope: backend
          - image: cogniflex-inference
            dockerfile: inference/Dockerfile
            scope: inference
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}

  draft-release:
    name: Create draft release
    needs: [prepare, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: extension/.nvmrc
          cache: yarn
          cache-dependency-path: extension/yarn.lock
      - name: Build extension
        working-directory: extension
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          # Release notes

          <!-- TODO: summarize what changed in this release -->

          ## Changelog

          <!-- TODO: fill the changelog -->

          ## Installation and running

          See README.md on how to install and run the application.

          ## Docker images

          You can pull the docker images for this release using the following commands:

          \`\`\`
          docker pull ghcr.io/${{ needs.prepare.outputs.owner }}/cogniflex-backend:${VERSION}
          docker pull ghcr.io/${{ needs.prepare.outputs.owner }}/cogniflex-inference:${VERSION}
          \`\`\`

          ## Browser extension

          Download \`cogniflex-extension-${VERSION}.zip\` from the assets below and load it as an unpacked extension.
          EOF

          gh release create "v${VERSION}" \
            "extension/release/cogniflex-extension-${VERSION}.zip" \
            --title "v${VERSION} - Release" \
            --notes-file release-notes.md \
            --draft \
            --verify-tag

  deploy:
    name: Deploy application
    needs: [prepare, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          command_timeout: 60m
          script: |
            export APP_DIR="${{ secrets.SERVER_DEPLOY_PATH }}"
            export DEPLOY_BRANCH="master"
            export REGISTRY="ghcr.io"
            export REGISTRY_USERNAME="${{ needs.prepare.outputs.owner }}"
            export REGISTRY_TOKEN="${{ secrets.SERVER_REGISTRY_TOKEN }}"
            export IMAGE_TAG="${{ steps.version.outputs.version }}"
            bash "$APP_DIR/deploy.sh"
