spring:
  application:
    name: cogniflex
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  servlet:
    multipart:
      max-file-size: "${MULTIPART_MAX_SIZE:100MB}"
      max-request-size: "${MULTIPART_MAX_SIZE:100MB}"
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cogniflex}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: "${BACKEND_PORT:8080}"

app:
  input-limits:
    text:
      min-words: "${INPUT_MIN_WORDS:40}"
      max-characters: "${INPUT_MAX_TEXT_CHARACTERS:50000}"
    media:
      max-image-size: "${INPUT_MAX_IMAGE_SIZE:10MB}"
      max-video-size: "${INPUT_MAX_VIDEO_SIZE:100MB}"
      max-image-pixels: "${INPUT_MAX_IMAGE_PIXELS:50000000}"

management:
  server:
    port: "${MANAGEMENT_PORT:8081}"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,inference

grpc:
  inference:
    host: ${INFERENCE_HOST:localhost}
    port: ${INFERENCE_PORT:50051}
    timeout: 30s
    plaintext: true
