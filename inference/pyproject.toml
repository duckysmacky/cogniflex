[project]
name = "cogniflex-inference"
version = "0.2.0"
description = "Cogniflex gRPC inference service"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.71.0",
    "grpcio-tools>=1.71.0",
    "protobuf>=6.31.1",
    "pyyaml>=6.0.2",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "opencv-python-headless>=4.11.0.86,<5",
    "pillow>=11.2.1",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
